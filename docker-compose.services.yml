# yaml-language-server: $schema=https://raw.githubusercontent.com/compose-spec/compose-spec/main/schema/compose-spec.json
services:
  login-service:
    build:
      context: ./login-service
      dockerfile: Dockerfile.dev

    environment:
      DATABASE_URL: postgres://login:login@login-postgres:5432/login?sslmode=disable

    ports:
      - "8082:8080"

    volumes:
      - ./login-service:/app
      - login_go_cache:/go

    command: ["air", "-c", ".air.docker.toml"]

    depends_on:
      login-postgres:
        condition: service_healthy
      login-migrate:
        condition: service_completed_successfully

    networks:
      - services

    restart: unless-stopped
  login-migrate:
    image: migrate/migrate

    command:
      - "-path=/migrations"
      - "-database=postgres://login:login@login-postgres:5432/login?sslmode=disable"
      - "up"

    volumes:
      - ./login-service/migrations:/migrations

    depends_on:
      login-postgres:
        condition: service_healthy

    networks:
      - services
  login-postgres:
    image: postgres:16-alpine

    environment:
      POSTGRES_DB: login
      POSTGRES_USER: login
      POSTGRES_PASSWORD: login

    ports:
      - "5456:5432"

    volumes:
      - login_postgres_data:/var/lib/postgresql/data

    restart: unless-stopped

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U login -d login"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

    networks:
      - services


volumes:
  login_postgres_data:
  login_go_cache:


networks:
  services: