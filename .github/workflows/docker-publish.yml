name: Build and Push Docker Image

on:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  docker:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - name: login-service
            context: ./login-service
            file: ./login-service/Dockerfile
          - name: core-banking-service
            context: ./core-banking-service
            file: ./core-banking-service/Dockerfile
          - name: notification-service
            context: ./notification-service
            file: ./notification-service/Dockerfile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push ${{ matrix.service.name }}
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.service.context }}
          file: ${{ matrix.service.file }}
          push: true
          tags: ${{ vars.DOCKERHUB_USERNAME }}/${{ matrix.service.name }}:latest
