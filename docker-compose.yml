services:

  # Core banking services
  postgres:
    image: postgres:16-alpine

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: banking

    ports:
      - "5454:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d
      - ./scripts:/scripts

    restart: unless-stopped

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - banking


  celery:
    build: .
    command: uv run celery -A config worker --loglevel=INFO

    env_file:
      - .env.docker

    volumes:
      - .:/app
      - docker_venv:/app/.venv

    depends_on:
      migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy

    networks:
      - banking


  celery-beat:
    build: .
    command: uv run celery -A config beat --loglevel=INFO

    env_file:
      - .env.docker

    volumes:
      - .:/app
      - docker_venv:/app/.venv

    depends_on:
      migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy

    networks:
      - banking


  # Shared infrastructure
  rabbitmq:
    image: rabbitmq:4-management

    ports:
      - "5672:5672"
      - "15672:15672"

    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

    restart: unless-stopped

    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s

    networks:
      - banking


  # Notification service components
  notification-postgres:
    image: postgres:16-alpine

    environment:
      POSTGRES_DB: notifications
      POSTGRES_USER: notifications
      POSTGRES_PASSWORD: notifications

    ports:
      - "5455:5432"

    volumes:
      - notification_postgres_data:/var/lib/postgresql/data

    restart: unless-stopped

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notifications -d notifications"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

    networks:
      - banking


  notification-migrate:
    image: migrate/migrate

    command:
      - "-path=/migrations"
      - "-database=postgres://notifications:notifications@notification-postgres:5432/notifications?sslmode=disable"
      - "up"

    volumes:
      - ./notification-service/migrations:/migrations

    depends_on:
      notification-postgres:
        condition: service_healthy

    networks:
      - banking


  notification-service:
    build:
      context: ./notification-service
      dockerfile: Dockerfile

    environment:
      DATABASE_URL: postgres://notifications:notifications@notification-postgres:5432/notifications
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/

      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      SMTP_FROM: notifications@banking.local

    volumes:
      - ./notification-service:/app

    depends_on:
      notification-postgres:
        condition: service_healthy
      notification-migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy

    networks:
      - banking
  mailpit:
    image: axllent/mailpit:latest

    ports:
      - "1025:1025"
      - "8025:8025"

    networks:
      - banking


  migrate:
    build: .
    command: uv run python manage.py migrate

    env_file:
      - .env.docker

    volumes:
      - .:/app
      - docker_venv:/app/.venv

    depends_on:
      postgres:
        condition: service_healthy

    networks:
      - banking


  web:
    build: .
    command: uv run python manage.py runserver 0.0.0.0:8000

    env_file:
      - .env.docker

    volumes:
      - .:/app
      - docker_venv:/app/.venv

    ports:
      - "8000:8000"

    depends_on:
      migrate:
        condition: service_completed_successfully

    networks:
      - banking


volumes:
  postgres_data:
  docker_venv:
  rabbitmq_data:
  notification_postgres_data:


networks:
  banking: