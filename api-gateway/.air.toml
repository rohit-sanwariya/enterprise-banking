root = "."
tmp_dir = "tmp"

[build]
cmd = "go build -o ./tmp/api-gateway ./cmd/server"
entrypoint = "./tmp/api-gateway"

include_ext = ["go"]
include_dir = ["cmd", "internal"]
exclude_dir = ["tmp", "vendor"]

delay = 1000
poll = true
poll_interval = 500

stop_on_error = true
send_interrupt = true
kill_delay = 500

[log]
time = true

[misc]
clean_on_exit = true