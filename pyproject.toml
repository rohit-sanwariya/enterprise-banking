[project]
name = "enterprise-banking"
version = "0.1.0"
description = "enterprise bank"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "django>=6.0.7",
    "django-environ>=0.14.0",
    "django-filter>=26.1",
    "djangorestframework>=3.17.1",
    "drf-spectacular>=0.30.0",
    "phonenumbers>=9.0.36",
    "phonenumberslite>=9.0.36",
    "psycopg[binary]>=3.3.4",
    "python-dotenv>=1.2.2",
]

[dependency-groups]
dev = [
    "factory-boy>=3.3.3",
    "faker>=40.36.0",
    "mypy>=2.3.0",
    "pre-commit>=4.6.1",
    "pytest>=9.1.1",
    "pytest-django>=4.12.0",
    "ruff>=0.16.1",
]
[tool.ruff]
target-version = "py313"
line-length = 88

exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "migrations",
    "static",
    "media",
]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "UP",     # pyupgrade
]

ignore = [
    "E501",   # line too long - formatter handles this
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
