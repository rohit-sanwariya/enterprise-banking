image:
  repository: rohitsanwariya/enterprise-banking
  tag: latest
  pullPolicy: Always

django:
  secretKey: "28^)8%w&#x1sw4ohsyjs-27j7bm&)&m#39i&v*cdgns+*_b)-4"

postgres:
  enabled: true
  fullnameOverride: postgres
  architecture: standalone
  auth:
    enablePostgresUser: true
    postgresPassword: postgres
    database: banking
  primary:
    persistence:
      enabled: true
      storageClass: linode-block-storage
      size: 10Gi

fluentBit:
  enabled: false
  image:
    repository: cr.fluentbit.io/fluent/fluent-bit
    tag: 3.2
    pullPolicy: IfNotPresent

logging:
  enabled: true

  filebeat:
    enabled: true
    image: docker.elastic.co/beats/filebeat
    tag: 9.1.2

elasticsearch:
  fullnameOverride: elasticsearch
  nodeGroup: master
  replicas: 1
  minimumMasterNodes: 1
  roles:
    master: "true"
    ingest: "true"
    data: "true"
    remote_cluster_client: "true"
    ml: "false"
  esJavaOpts: "-Xms512m -Xmx512m"
  volumeClaimTemplate:
    storageClassName: linode-block-storage
    accessModes: ["ReadWriteOnce"]
    resources:
      requests:
        storage: 10Gi
  persistence:
    enabled: true

logstash:
  fullnameOverride: logstash
  replicas: 1
  logstashPipeline:
    logstash.conf: |-
      input {
        beats {
          port => 5044
        }
      }
      filter {
        if [kubernetes] {
          mutate {
            add_field => { "service" => "%{[kubernetes][container][name]}" }
          }
        }
      }
      output {
        elasticsearch {
          hosts => ["http://elasticsearch:9200"]
          index => "enterprise-banking-%{+YYYY.MM.dd}"
        }
        stdout { codec => rubydebug }
      }
  extraPorts:
    - name: beats
      containerPort: 5044
      protocol: TCP
  service:
    ports:
      - name: beats
        port: 5044
        targetPort: 5044
        protocol: TCP