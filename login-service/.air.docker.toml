root = "."
tmp_dir = "tmp"

[build]
  # 1. Compiles your actual app binary with optimization flags disabled
  cmd = "go build -gcflags=\"all=-N -l\" -o ./tmp/main ./cmd/server"
  
  # 2. Instructs air to run the compiled binary via Delve
  bin = "dlv --listen=:40000 --headless=true --api-version=2 --accept-multiclient exec ./tmp/main"
  
  include_ext = ["go"]
  exclude_dir = ["tmp", "vendor"]
  delay = 1000
  stop_on_error = true

[log]
  time = true

[misc]
  clean_on_exit = true
