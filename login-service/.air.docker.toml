root = "."
tmp_dir = "tmp"

[build]
  cmd = "go build -gcflags=\"all=-N -l\" -o ./tmp/main ./cmd/server"
  bin = "./tmp/main"
  full_bin = "dlv exec --accept-multiclient --continue --headless --listen=:2345 --api-version=2 ./tmp/main"

  include_ext = ["go"]
  exclude_dir = ["tmp", "vendor"]
  delay = 1000
  stop_on_error = true

[log]
  time = true

[misc]
  clean_on_exit = true