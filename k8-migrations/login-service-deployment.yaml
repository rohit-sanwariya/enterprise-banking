apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    io.kompose.service: login-service
  name: login-service
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: login-service
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        io.kompose.service: login-service
    spec:
      containers:
        - args:
            - air
            - -c
            - .air.docker.toml
          env:
            - name: DATABASE_URL
              value: postgres://login:login@login-postgres:5432/login?sslmode=disable
          image: login-service
          name: login-service
          ports:
            - containerPort: 8080
              protocol: TCP
            - containerPort: 2345
              protocol: TCP
          volumeMounts:
            - mountPath: /app
              name: login-service-cm0
            - mountPath: /go
              name: login-go-cache
      restartPolicy: Always
      volumes:
        - configMap:
            name: login-service-cm0
          name: login-service-cm0
        - name: login-go-cache
          persistentVolumeClaim:
            claimName: login-go-cache
